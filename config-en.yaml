projects:
  - project:
      name: StarKid
      link: "https://github.com/blokyk/starkid"
      tags:
        - C#
        - Developer tooling
        - CLI
    description: >
      A C\# package that allows creating full-featured command-line apps
      by simply describing the accepted options, arguments and commands
      with normal C\# fields and methods. StarKid then generates the
      corresponding argument parser at compile-time using Roslyn source
      generators.
    from: "2022"
    to: "2025"
  - project:
      name: Lotus
      link: https://github.com/lotuslang/lotus
      tags:
        - C#
        - Compiler
        - Parsing
        - Language Design
    description: >
      A custom programming language, designed and implemented entirely by
      myself from the ground up. Still in the early stages (currently working
      on the type system). In practice, the focus is mainly on being able to
      give clear (Elm- or Rust-style) error messages.
    from: "2020"
    to: "present"
  - project:
      name: RISC-V emulator
      link: "https://github.com/blokyk/px-cs351"
      tags:
        - C
        - RISC-V Assembly
        - Validation
    description: >
      A RISC-V assembler & emulator written in C, implementing the basic RV64-I
      instruction set. Written in the context of course CS351, with a focus on
      testing and accuracy. Implementation-wise, smart use of macros and
      preprocessor tricks allowed an extensible, declarative way to specify
      instructions. Modifying a reference emulator allowed fuzzing-like testing
      and validation of the implementation.
    from: "October 2023"
    to: "January 2024"
  - project:
      name: Open-source FPGA toolchain
      tags:
        - FPGA
        - Non-proprietary
        - VHDL
    date: "January 2024"
    description: >
      A small toolchain (simulator, synthesizer, place-and-router, flasher) for
      working with a few Xilinx FPGA boards in VHDL, built purely out of
      open-source software (and spite towards Vivado). I only gathered and glued
      together existing components, but it's harder than it sounds :)
