jobs:
  - position: RISC-V Vector tooling
    company:
      name: LCIS laboratory
      link: https://lcis.fr
    from: "June"
    to: "August 2024"
    description:
      - Built a modified RISC-V toolchain for the Vector (RVV) extension
      - Surveyed the state-of-the-art of RVV co-processor hardware designs
      - Manually vectorized (in both AVX and RVV) data-processing algorithms
      - Measured and compared the performance of vectorized vs scalar variants
