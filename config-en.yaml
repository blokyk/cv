  - position: Cache coherency hints in RISC-V
    company:
      name: TIMA laboratory
      link: https://tima.univ-grenoble-alpes.fr/
    from: "April"
    to: "September 2026"
    description:
      - Added new hint instructions to the LLVM compiler
      - Heavily modified an optimisation pass to use those new instructions
      - Added support for those instructions to the gem5 simulator
      - Validated a cache coherency protocol's behavior w.r.t. the new hints
      - Measured the performance impact of the optimisation and instruction
      - Documented the process and packaged the modifications and results

